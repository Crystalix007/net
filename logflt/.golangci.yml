version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - modernize
    - revive
    - misspell
    - unconvert
    - unparam
    - nilerr

linters-settings:
  gofumpt:
    extra-rules: true
  goimports:
    local-prefixes: logflt

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  exclude-dirs: []
